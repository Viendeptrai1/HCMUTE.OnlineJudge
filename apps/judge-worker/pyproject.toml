[project]
name = "oj-judge-worker"
version = "0.1.0"
description = "HCMUTE OnlineJudge — judge worker (SQS consumer + isolate sandbox)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
