[project]
name = "oj-web"
version = "0.1.0"
description = "HCMUTE OnlineJudge web app (FastAPI + Jinja2 + HTMX)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "markdown>=3.7",
    "mangum>=0.19",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "boto3>=1.35",
    "python-jose>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
