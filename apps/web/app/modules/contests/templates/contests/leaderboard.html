{% extends "base.html" %}
{% block title %}Leaderboard - {{ contest.title }}{% endblock %}

{% block content %}
<div class="mb-4 flex items-center justify-between gap-3">
  <div>
    <a href="/contests/{{ contest.id }}" class="text-sm text-sky-700 hover:underline">← {{ contest.title }}</a>
    <h1 class="mt-1 text-2xl font-bold">Bảng xếp hạng</h1>
  </div>
  <div class="text-xs text-slate-500">
    <span class="mr-1 rounded bg-slate-100 px-1.5 py-0.5 uppercase">{{ contest.scoring_mode.value }}</span>
    {% if phase == "running" %}
      <span class="rounded bg-emerald-100 px-1.5 py-0.5 text-emerald-700">tự làm mới 5s</span>
    {% endif %}
  </div>
</div>

<div id="leaderboard"
     {% if phase == "running" %}
     hx-get="/contests/{{ contest.id }}/leaderboard"
     hx-trigger="every 5s"
     hx-target="#leaderboard"
     hx-swap="outerHTML"
     {% endif %}>
  {% include "contests/_leaderboard.html" %}
</div>
{% endblock %}
