{% extends "base.html" %}
{% block title %}{{ "Sửa kỳ thi" if contest else "Tạo kỳ thi" }} - HCMUTE OJ{% endblock %}

{% block content %}
{% set is_edit = contest is not none %}
<div class="mx-auto max-w-2xl">
  <h1 class="mb-6 text-2xl font-bold tracking-tight">
    {{ "Chỉnh sửa kỳ thi" if is_edit else "Tạo kỳ thi mới" }}
  </h1>
  {% if error %}
    <div class="mb-4 rounded-md border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">{{ error }}</div>
  {% endif %}

  <form method="post"
        action="{{ ('/contests/' ~ contest.id) if is_edit else '/contests' }}"
        class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Slug *</label>
        <input type="text" name="slug" required pattern="[a-z0-9][a-z0-9\-]*" maxlength="64"
               value="{{ (contest.slug if contest else '') or '' }}"
               class="w-full rounded-md border-slate-300 font-mono text-sm">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Tiêu đề *</label>
        <input type="text" name="title" required maxlength="255"
               value="{{ (contest.title if contest else '') or '' }}"
               class="w-full rounded-md border-slate-300 text-sm">
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Bắt đầu *</label>
        <input type="datetime-local" name="start_at" required
               value="{{ contest.start_at.strftime('%Y-%m-%dT%H:%M') if contest else '' }}"
               class="w-full rounded-md border-slate-300 text-sm">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Kết thúc *</label>
        <input type="datetime-local" name="end_at" required
               value="{{ contest.end_at.strftime('%Y-%m-%dT%H:%M') if contest else '' }}"
               class="w-full rounded-md border-slate-300 text-sm">
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Thể thức</label>
        <select name="scoring_mode" class="w-full rounded-md border-slate-300 text-sm">
          {% for m in scoring_modes %}
            <option value="{{ m.value }}" {% if contest and contest.scoring_mode == m %}selected{% endif %}>{{ m.value }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Hiển thị</label>
        <select name="visibility" class="w-full rounded-md border-slate-300 text-sm">
          {% for v in visibilities %}
            <option value="{{ v.value }}" {% if contest and contest.visibility == v %}selected{% endif %}>{{ v.value }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Penalty (phút)</label>
        <input type="number" name="penalty_minutes" min="0" max="120"
               value="{{ contest.penalty_minutes if contest else 20 }}"
               class="w-full rounded-md border-slate-300 text-sm">
      </div>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Mô tả (Markdown)</label>
      <textarea name="description" rows="4"
                class="w-full rounded-md border-slate-300 text-sm font-mono">{{ (contest.description if contest else '') or '' }}</textarea>
    </div>

    <div class="flex items-center justify-between pt-2">
      <a href="/contests" class="text-sm text-slate-500">← Huỷ</a>
      <button type="submit" class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">
        {{ "Lưu" if is_edit else "Tạo" }}
      </button>
    </div>
  </form>
</div>
{% endblock %}
