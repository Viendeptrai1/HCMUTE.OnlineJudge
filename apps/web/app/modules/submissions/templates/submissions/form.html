{% extends "base.html" %}
{% block title %}Nộp bài - {{ problem.title }}{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/dracula.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/clike/clike.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/python/python.min.js" defer></script>
{% endblock %}

{% block content %}
<div class="mb-4 text-sm">
  <a href="/problems/{{ problem.id }}" class="text-slate-500 hover:underline">&larr; Về bài: {{ problem.title }}</a>
</div>

{% if error %}
  <div class="mb-4 rounded-md border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">{{ error }}</div>
{% endif %}

<form method="post" action="/submissions" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
  <input type="hidden" name="problem_id" value="{{ problem.id }}">

  <h1 class="text-xl font-semibold">Nộp bài: {{ problem.title }}</h1>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Ngôn ngữ</label>
    <select name="language" id="lang-select" class="rounded-md border-slate-300 shadow-sm">
      {% for lang in languages %}
        <option value="{{ lang.value }}">{{ lang.value }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Source code</label>
    <textarea name="source_code" id="source-code" rows="20" required
              class="w-full rounded-md border-slate-300 font-mono text-sm shadow-sm">// Viết code của bạn ở đây
#include <iostream>
int main() {
    int a, b; std::cin >> a >> b;
    std::cout << a + b;
}
</textarea>
  </div>

  <div class="flex items-center gap-2">
    <button type="submit" class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
      Nộp bài
    </button>
    <a href="/problems/{{ problem.id }}" class="text-sm text-slate-500 hover:underline">Huỷ</a>
  </div>
</form>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const ta = document.getElementById("source-code");
  const langSelect = document.getElementById("lang-select");
  const modeMap = {
    cpp: "text/x-c++src",
    python: "python",
  };
  const editor = CodeMirror.fromTextArea(ta, {
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    mode: modeMap[langSelect.value] || "text/x-c++src",
    theme: "dracula",
  });
  editor.setSize("100%", 420);
  langSelect.addEventListener("change", e => {
    editor.setOption("mode", modeMap[e.target.value] || "text/x-c++src");
  });
});
</script>
{% endblock %}
