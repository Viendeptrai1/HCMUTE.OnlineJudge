{% extends "base.html" %}
{% block title %}{% if testcase %}Sửa{% else %}Thêm{% endif %} testcase - {{ problem.title }}{% endblock %}

{% block content %}
<div class="mb-4 text-sm">
  <a href="/problems/{{ problem.id }}/testcases" class="text-slate-500 hover:underline">&larr; Testcases của {{ problem.title }}</a>
</div>

<form method="post"
      action="{% if testcase %}/problems/{{ problem.id }}/testcases/{{ testcase.id }}{% else %}/problems/{{ problem.id }}/testcases{% endif %}"
      class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
  <h1 class="text-xl font-semibold">{% if testcase %}Sửa testcase{% else %}Thêm testcase mới{% endif %}</h1>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium">Thứ tự (order_index)</label>
      <input type="number" name="order_index" value="{{ testcase.order_index if testcase else 1 }}"
             class="w-full rounded-md border-slate-300 text-sm" required>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium">Score</label>
      <input type="number" name="score" value="{{ testcase.score if testcase else 10 }}"
             class="w-full rounded-md border-slate-300 text-sm" required>
    </div>
  </div>

  <div>
    <label class="inline-flex items-center gap-2 text-sm">
      <input type="checkbox" name="is_sample" value="true"
             {% if testcase and testcase.is_sample %}checked{% endif %}
             class="rounded border-slate-300">
      Hiển thị công khai (sample) cho thí sinh xem ví dụ
    </label>
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium">Input</label>
    <textarea name="input_text" rows="6" class="w-full rounded-md border-slate-300 font-mono text-sm"
              placeholder="Dữ liệu vào chuẩn (stdin)">{{ testcase.input_text if testcase else "" }}</textarea>
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium">Expected output</label>
    <textarea name="expected_output" rows="6" class="w-full rounded-md border-slate-300 font-mono text-sm"
              placeholder="Kết quả mong đợi (stdout)">{{ testcase.expected_output if testcase else "" }}</textarea>
  </div>

  <div class="flex items-center gap-2">
    <button type="submit" class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
      Lưu
    </button>
    <a href="/problems/{{ problem.id }}/testcases" class="text-sm text-slate-500 hover:underline">Huỷ</a>
  </div>
</form>
{% endblock %}
