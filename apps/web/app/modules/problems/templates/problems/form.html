{% extends "base.html" %}
{% block title %}{{ "Sửa bài" if problem else "Thêm bài" }} - HCMUTE OJ{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="/problems" class="text-sm text-slate-500 hover:underline">&larr; Danh sách bài</a>
</div>

<form method="post"
      action="{{ '/problems/' + problem.id|string if problem else '/problems' }}"
      class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
  <h1 class="text-xl font-semibold">{{ "Chỉnh sửa bài" if problem else "Tạo bài mới" }}</h1>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Tiêu đề</label>
    <input type="text" name="title" required maxlength="255"
           value="{{ problem.title if problem else '' }}"
           class="w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500">
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Đề bài (Markdown)</label>
    <textarea name="statement_md" rows="12"
              class="w-full rounded-md border-slate-300 font-mono text-sm shadow-sm focus:border-sky-500 focus:ring-sky-500">{{ problem.statement_md if problem else '' }}</textarea>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Time limit (ms)</label>
      <input type="number" name="time_limit_ms" min="100" max="60000"
             value="{{ problem.time_limit_ms if problem else 1000 }}"
             class="w-full rounded-md border-slate-300 shadow-sm">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Memory (KB)</label>
      <input type="number" name="memory_limit_kb" min="1024" max="1048576"
             value="{{ problem.memory_limit_kb if problem else 262144 }}"
             class="w-full rounded-md border-slate-300 shadow-sm">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Độ khó</label>
      <select name="difficulty" class="w-full rounded-md border-slate-300 shadow-sm">
        {% for d in difficulties %}
          <option value="{{ d.value }}" {% if problem and problem.difficulty == d %}selected{% endif %}>{{ d.value }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="flex items-center gap-2 pt-2">
    <button type="submit" class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">
      {{ "Lưu thay đổi" if problem else "Tạo bài" }}
    </button>
    <a href="/problems" class="text-sm text-slate-500 hover:underline">Huỷ</a>
  </div>
</form>
{% endblock %}
