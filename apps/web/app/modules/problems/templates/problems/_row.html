<tr id="problem-{{ p.id }}">
  <td class="px-4 py-2">
    <a href="/problems/{{ p.id }}" class="font-medium text-sky-700 hover:underline">{{ p.title }}</a>
  </td>
  <td class="px-4 py-2">
    <span class="rounded bg-slate-100 px-2 py-0.5 text-xs uppercase">{{ p.difficulty.value }}</span>
  </td>
  <td class="px-4 py-2 text-slate-600">{{ p.time_limit_ms }} ms</td>
  <td class="px-4 py-2 text-slate-600">{{ (p.memory_limit_kb / 1024) | int }} MB</td>
  <td class="px-4 py-2 text-right">
    {% if current_user and current_user.role.value in ("educator", "admin") %}
      <a href="/problems/{{ p.id }}/edit" class="text-sky-600 hover:underline">Sửa</a>
      <button type="button"
              hx-delete="/problems/{{ p.id }}"
              hx-confirm="Xoá bài '{{ p.title }}'?"
              hx-target="#problem-{{ p.id }}"
              hx-swap="outerHTML"
              class="ml-3 text-rose-600 hover:underline">Xoá</button>
    {% else %}
      <a href="/problems/{{ p.id }}" class="text-slate-500 hover:text-sky-600">Xem</a>
    {% endif %}
  </td>
</tr>
