{% extends "base.html" %}
{% block title %}Đăng nhập - HCMUTE OJ{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-6 text-2xl font-bold">Đăng nhập</h1>

  {% if error %}
    <div class="mb-4 rounded-md border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Email hoặc username</label>
      <input type="text" name="identifier" required autofocus
             class="w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Mật khẩu</label>
      <input type="password" name="password" required
             class="w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500">
    </div>
    <button type="submit" class="w-full rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">
      Đăng nhập
    </button>
    <p class="text-center text-sm text-slate-500">
      Chưa có tài khoản? <a href="/auth/register" class="text-sky-600 hover:underline">Đăng ký</a>
    </p>
  </form>
</div>
{% endblock %}
