{% extends "base.html" %}
{% block title %}Đăng ký - HCMUTE OJ{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-6 text-2xl font-bold">Tạo tài khoản</h1>

  {% if error %}
    <div class="mb-4 rounded-md border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/register" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
      <input type="email" name="email" required
             class="w-full rounded-md border-slate-300 shadow-sm">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Username</label>
      <input type="text" name="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_.\-]+"
             class="w-full rounded-md border-slate-300 shadow-sm">
      <p class="mt-1 text-xs text-slate-500">Chỉ chữ cái, số, <code>_ . -</code></p>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Họ và tên</label>
      <input type="text" name="full_name"
             class="w-full rounded-md border-slate-300 shadow-sm">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Mật khẩu</label>
      <input type="password" name="password" required minlength="6"
             class="w-full rounded-md border-slate-300 shadow-sm">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Vai trò</label>
      <select name="role" class="w-full rounded-md border-slate-300 shadow-sm">
        {% for r in roles %}
          <option value="{{ r.value }}">{{ r.value }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="w-full rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">
      Đăng ký
    </button>
    <p class="text-center text-sm text-slate-500">
      Đã có tài khoản? <a href="/auth/login" class="text-sky-600 hover:underline">Đăng nhập</a>
    </p>
  </form>
</div>
{% endblock %}
