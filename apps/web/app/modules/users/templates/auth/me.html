{% extends "base.html" %}
{% block title %}Tài khoản của tôi{% endblock %}

{% block content %}
<div class="rounded-lg border border-slate-200 bg-white p-6">
  <h1 class="mb-4 text-2xl font-bold">Tài khoản</h1>
  <dl class="grid grid-cols-1 gap-2 text-sm sm:grid-cols-2">
    <div><dt class="text-slate-400">Username</dt><dd class="font-medium">{{ current_user.username }}</dd></div>
    <div><dt class="text-slate-400">Email</dt><dd>{{ current_user.email }}</dd></div>
    <div><dt class="text-slate-400">Họ tên</dt><dd>{{ current_user.full_name or "(chưa đặt)" }}</dd></div>
    <div><dt class="text-slate-400">Vai trò</dt><dd class="uppercase">{{ current_user.role.value }}</dd></div>
  </dl>
  <form action="/auth/logout" method="post" class="mt-6">
    <button type="submit" class="rounded-md bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-700">Đăng xuất</button>
  </form>
</div>
{% endblock %}
