{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="rounded-lg border border-slate-200 bg-white p-8 text-center">
  <h1 class="text-3xl font-bold text-slate-900">404</h1>
  <p class="mt-2 text-slate-600">Không tìm thấy <code class="rounded bg-slate-100 px-1">{{ path }}</code>.</p>
  <a href="/" class="mt-4 inline-block text-sky-600 hover:underline">Về trang chủ</a>
</div>
{% endblock %}
