[project]
name = "hcmute-online-judge"
version = "0.1.0"
description = "HCMUTE Online Judge monorepo"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/web", "apps/judge-worker"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "types-Markdown>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = [
    "E501",
    "B008",  # FastAPI pattern: Depends/Form/Query trong argument default
    "UP046", # Generic[T] syntax cũ vẫn ok để tương thích
    "UP047", # tương tự UP046 cho functions
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["apps/web/alembic/versions"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/web/tests", "apps/judge-worker/tests"]
pythonpath = ["apps/web", "apps/judge-worker"]
addopts = "--import-mode=importlib"
